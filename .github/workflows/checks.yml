name: Local application checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned public dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.lock
      - name: Run isolated backend regression
        run: .\.venv\Scripts\python.exe scripts/run_offline_tests.py
      - name: Check browser interaction contract
        run: node --test tests/test_frontend.mjs
      - name: Build credential-free source package
        run: python scripts/build_release.py
